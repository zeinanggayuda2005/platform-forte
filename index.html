<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORTE — Masuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/forte-logo.png">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="center-layout">
  <main class="card login-card">
    <div class="brand-header" style="text-align: left;">
      <img src="img/forte.png" alt="Logo FORTE" style="width: 100%; max-width: 250px; height: auto; margin-bottom: 16px; display: block; object-fit: contain;">
      <h1 style="display: none;">FORTE</h1>
    </div>

    <!-- Login Satu Pintu: Identifikasi otomatis Guru/Siswa dari Username -->
    <form id="form-login" class="stack">
      <label class="field"><span>Username (NIS/NISN atau NIP)</span>
        <input type="text" id="username" placeholder="Masukkan NIS atau NIP Anda" required autocomplete="username">
      </label>
      <label class="field"><span>Password</span>
        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn primary btn-large" style="margin-top: 8px;">Masuk ke Aplikasi</button>
    </form>
    <p id="msg" class="msg" aria-live="polite"></p>
  </main>
</body>
</html>
