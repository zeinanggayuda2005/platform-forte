<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORTE — Tambah Akun Baru</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/forte-logo.png">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/tambah-akun.js" defer></script>
</head>
<body class="app-layout dashboard">
  <header class="topbar">
    <div class="brand">
      <img src="img/forte-logo.png" alt="Logo FORTE" style="height: 38px; width: auto; max-width: 150px; object-fit: contain; display: block;">
      <div><strong style="display:none;">FORTE</strong><small>Manajemen Akun</small></div>
    </div>
    <div class="user-actions">
      <a href="guru.html" class="btn outline small">Kembali ke Dashboard</a>
    </div>
  </header>

  <main class="container">
    <section class="card form-card stack" style="max-width: 500px; margin: 0 auto; width: 100%;">
      <h2>Tambah Akun Pengguna</h2>
      <p class="subtitle" style="margin-bottom: 8px;">Daftarkan akses untuk Siswa atau Guru lain.</p>
      <form id="add-account-form" class="stack">
        <div class="row" style="margin-bottom: 8px;">
           <label style="cursor: pointer; font-weight: 600;"><input type="radio" name="role_akun" value="siswa" checked> Siswa</label>
           <label style="cursor: pointer; font-weight: 600; margin-left: 16px;"><input type="radio" name="role_akun" value="guru"> Guru</label>
        </div>
        <input type="text" name="username" placeholder="NIS (Siswa) / NIP (Guru)" required>
        <input type="text" name="nama" placeholder="Nama Lengkap" required>
        <input type="text" name="info" placeholder="Kelas (Siswa) / Mapel (Guru)" required>
        <input type="password" name="password" placeholder="Password Akun" required>
        <button type="submit" class="btn primary">Daftarkan Akun</button>
      </form>
      <p id="add-account-msg" class="msg"></p>
    </section>
  </main>
</body>
</html>
